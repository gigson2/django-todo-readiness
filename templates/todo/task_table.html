{% if object_list %}
  <table>
    <thead>
      <tr><th scope="col">Task</th><th scope="col">Due date</th></tr>
    </thead>
    <tbody>
      {% for item in object_list %}
        <tr><td>{{ item.text }}</td><td>{{ item.due_date }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>No tasks found.</p>
{% endif %}
